<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>School Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F5FA; --surface:#FFFFFF; --ink:#142038; --muted:#5E6B85; --rule:#DCE3EF; --tint:#EAF0FA;
  --primary:#1E429F; --gold:#F4C542; --pen:#D62839; --ok:#1F7A5C; --warn:#B7791F; --focus:#2F6BFF;
  --side-bg:#16307C; --side:264px;
  --sans:"Public Sans",system-ui,sans-serif; --serif:"Source Serif 4",Georgia,serif;
}
body.dark{--paper:#0E1525;--surface:#17213A;--ink:#E8EDF7;--muted:#9FAAC2;--rule:#27324D;--tint:#202C49;--primary:#3F66D8;--side-bg:#0A1022;--ok:#4CC49A;--warn:#E0A94B;--pen:#FF6B78}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:16px;line-height:1.5}
h1,h2,h3,h4{font-family:var(--serif);margin:0;font-weight:600;line-height:1.2}
h2{font-size:1.55rem}
h3{font-size:1.1rem;margin-bottom:.7rem}
h4{font-size:1rem}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* buttons and fields */
.btn{font:inherit;font-weight:600;background:var(--primary);color:#fff;border:2px solid var(--primary);padding:.55rem 1.1rem;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.5rem}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--primary)}
body.dark .btn.ghost{color:#9DB8FF;border-color:#4a68c4}
.btn.ghost:hover{background:var(--tint);filter:none}
.btn.danger{background:transparent;color:var(--pen);border-color:var(--pen);padding:.25rem .65rem;font-size:.85rem}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#142038}
.btn.red{background:transparent;border-color:var(--pen);color:var(--pen)}
.btn.big{padding:.9rem 1rem;font-size:1.02rem}
.btn.block{width:100%;padding:.85rem}
.btn.sm{padding:.3rem .7rem;font-size:.88rem;border-radius:8px}
.link{background:none;border:0;color:var(--primary);text-decoration:underline;font:inherit;cursor:pointer;padding:0}
body.dark .link{color:#9DB8FF}
label{display:flex;flex-direction:column;gap:.3rem;font-size:.9rem;font-weight:500;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--rule);border-radius:10px;padding:.55rem .7rem;min-width:0}
textarea{resize:vertical;min-height:4.5rem}
input:focus,select:focus,textarea:focus{border-color:var(--primary)}
input[type=checkbox]{width:1.1rem;height:1.1rem;accent-color:var(--primary)}
.check{flex-direction:row;align-items:center;gap:.5rem}
.err{color:var(--pen);font-weight:500;min-height:1.4em;margin:0}
.hint{font-size:.85rem;color:var(--muted);margin:0}
.filters{display:flex;flex-wrap:wrap;gap:1rem;align-items:flex-end;margin-bottom:1.25rem}
.filters select,.filters input{min-width:9rem}
.row{display:flex;flex-wrap:wrap;gap:.75rem;align-items:flex-end}
.stack{display:grid;gap:1rem}
.empty{background:var(--surface);border:1px dashed var(--rule);border-radius:12px;padding:1.4rem;color:var(--muted);margin:0}

/* tables and panels */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--rule);border-radius:12px;margin-bottom:1rem}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:.6rem .9rem;border-bottom:1px solid var(--rule);vertical-align:middle}
th{font-size:.85rem;color:var(--muted);font-weight:600;background:var(--tint)}
tr:last-child td{border-bottom:0}
.num{text-align:right}
input.mark{width:6rem;text-align:right}
td.g{font-weight:700;width:5rem}
td textarea{width:100%;min-width:14rem;min-height:3rem}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:1.2rem;margin-bottom:1.25rem}
.panel p{color:var(--muted);margin:.2rem 0 1rem;max-width:62ch}
.panel > :last-child{margin-bottom:0}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:1rem}
.chip{background:var(--tint);border-radius:999px;padding:.2rem .75rem;font-size:.9rem;display:inline-flex;align-items:center;gap:.4rem}
.chip-x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:1.1rem;line-height:1;padding:0}
.chip-x:hover{color:var(--pen)}
.tag{display:inline-block;padding:.1rem .65rem;border-radius:999px;font-size:.82rem;font-weight:600;background:var(--tint);color:var(--muted)}
.tag.present,.tag.good{background:rgba(31,122,92,.15);color:var(--ok)}
.tag.late,.tag.warn{background:rgba(183,121,31,.18);color:var(--warn)}
.tag.absent,.tag.bad{background:rgba(214,40,57,.14);color:var(--pen)}

/* page layout */
.shell{display:flex;min-height:100vh}
.mainwrap{flex:1;min-width:0;display:flex;flex-direction:column}
main{max-width:1100px;margin:0 auto;padding:1.4rem 1.25rem 4rem;width:100%}
.page-head{margin-bottom:1.25rem}
.page-head h2{margin:0}
.page-head p{color:var(--muted);margin:.25rem 0 0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:1rem;margin-bottom:1.25rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:1rem;align-items:start}
.grid2 > .panel{margin-bottom:0}
.quick{display:flex;flex-wrap:wrap;gap:.6rem}

/* sidebar */
.side{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--side-bg);color:#DCE6FF;display:flex;flex-direction:column;z-index:40;transform:translateX(-100%);transition:transform .2s}
.side.open{transform:none}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30}
.scrim[hidden]{display:none}
.brand{display:flex;align-items:center;gap:.7rem;padding:1.1rem 1rem;border-bottom:1px solid rgba(255,255,255,.1)}
.brand img{width:42px;height:42px;object-fit:contain;border-radius:8px;background:#fff;padding:2px}
.brand-mark{width:42px;height:42px;border-radius:10px;background:var(--gold);color:#142038;display:grid;place-items:center;flex:none}
.brand-name{font-family:var(--serif);font-weight:600;font-size:1.05rem;color:#fff;line-height:1.2}
.brand-motto{font-size:.78rem;color:#9DB2E6}
.nav{flex:1;overflow-y:auto;padding:.5rem .7rem}
.nav-g{font-size:.8rem;font-weight:600;color:#8FA6DD;margin:1rem .8rem .3rem}
.nav-i{display:flex;align-items:center;gap:.7rem;width:100%;background:none;border:0;color:#CBD8F7;font:inherit;font-weight:500;padding:.58rem .8rem;border-radius:10px;cursor:pointer;text-align:left}
.nav-i:hover{background:rgba(255,255,255,.08)}
.nav-i.on{background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.side-foot{padding:.6rem .7rem 1rem;border-top:1px solid rgba(255,255,255,.1)}
.ic{width:20px;height:20px;flex:none}
.badge{margin-left:auto;background:var(--gold);color:#142038;font-size:.75rem;font-weight:700;border-radius:999px;padding:.05rem .5rem}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:.75rem;padding:.7rem 1.1rem;background:var(--surface);border-bottom:1px solid var(--rule)}
.spacer{flex:1}
.iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{background:var(--tint)}
.chip-term{background:var(--tint);color:var(--primary);font-weight:600;padding:.25rem .75rem;border-radius:999px;font-size:.85rem}
body.dark .chip-term{color:#9DB8FF}
.kid-sw select,.kid-chip{font-weight:600;border-radius:999px;padding:.35rem .9rem;border:1.5px solid var(--rule);background:var(--surface)}
.kid-chip{display:none}
.user-chip{display:flex;align-items:center;gap:.6rem}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.9rem}
.user-meta{display:none;line-height:1.2}
.user-meta small{color:var(--muted)}
@media (min-width:960px){
  .side{transform:none}
  .mainwrap{margin-left:var(--side)}
  .menu-btn{display:none}
  .user-meta{display:block}
  .kid-chip{display:inline-block}
}

/* dashboard cards and charts */
.stat{display:flex;gap:.9rem;align-items:flex-start;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:1rem 1.1rem}
.stat.skel{min-height:84px;background:linear-gradient(90deg,var(--tint),var(--surface),var(--tint));background-size:200% 100%;animation:sk 1.4s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.stat-ic{width:42px;height:42px;border-radius:10px;background:var(--tint);color:var(--primary);display:grid;place-items:center;flex:none}
body.dark .stat-ic{color:#9DB8FF}
.stat.good .stat-ic{background:rgba(31,122,92,.15);color:var(--ok)}
.stat.warn .stat-ic{background:rgba(183,121,31,.18);color:var(--warn)}
.stat.bad .stat-ic{background:rgba(214,40,57,.14);color:var(--pen)}
.stat-v{font-family:var(--serif);font-size:1.65rem;font-weight:600;line-height:1.1}
.stat-l{color:var(--muted);font-size:.9rem}
.stat-s{font-size:.85rem;color:var(--muted)}
.hbars{display:grid;gap:.1rem}
.hb{display:grid;grid-template-columns:minmax(70px,34%) 1fr auto;gap:.6rem;align-items:center;margin:.4rem 0;font-size:.92rem}
.hb-t{height:10px;background:var(--tint);border-radius:999px;overflow:hidden}
.hb-f{display:block;height:100%;background:var(--primary);border-radius:999px}
.hb-f.good{background:var(--ok)} .hb-f.warn{background:var(--warn)} .hb-f.bad{background:var(--pen)}
.hb-v{font-weight:600;font-variant-numeric:tabular-nums}
.vcols{display:flex;gap:1rem;align-items:stretch;height:190px}
.vc{flex:1;display:flex;flex-direction:column;align-items:center;gap:.3rem}
.vc-b{flex:1;width:100%;max-width:72px;background:var(--tint);border-radius:8px 8px 0 0;display:flex;align-items:flex-end;overflow:hidden}
.vc-f{display:block;width:100%;background:var(--primary)}
.vc-f.good{background:var(--ok)} .vc-f.warn{background:var(--warn)} .vc-f.bad{background:var(--pen)}
.vc-v{font-weight:600;font-size:.9rem}
.vc-l{font-size:.85rem;color:var(--muted)}
.plain{list-style:none;margin:0;padding:0}
.plain li{padding:.55rem 0;border-bottom:1px solid var(--rule)}
.plain li:last-child{border-bottom:0}

/* attendance control */
.seg{display:inline-flex;border:1.5px solid var(--rule);border-radius:10px;overflow:hidden}
.seg label{position:relative;display:block;flex-direction:row}
.seg input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.seg span{display:block;padding:.4rem .8rem;font-weight:600;color:var(--muted);min-width:2.6rem;text-align:center}
.seg input:checked + span.p{background:var(--ok);color:#fff}
.seg input:checked + span.l{background:var(--warn);color:#fff}
.seg input:checked + span.a{background:var(--pen);color:#fff}
.seg input:focus-visible + span{outline:3px solid var(--focus);outline-offset:-3px}

/* timetable */
.tt{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.9rem}
.tt-day h4{margin-bottom:.5rem}
.slot{background:var(--surface);border:1px solid var(--rule);border-left:4px solid var(--primary);border-radius:10px;padding:.55rem .75rem;margin-bottom:.55rem}

/* announcements */
.ann{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:1rem 1.2rem;margin-bottom:.9rem}
.ann.pinned{border-left:5px solid var(--gold)}
.ann h3{margin-bottom:.2rem}
.ann .meta{font-size:.85rem;color:var(--muted);margin-bottom:.6rem;display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.ann p{margin:0;max-width:75ch}
.grades-grid{display:grid;grid-template-columns:90px 90px 1fr auto;gap:.5rem;align-items:center;margin-bottom:.5rem}

/* report card */
.card{background:var(--surface);border:1px solid var(--ink);padding:2rem 2.25rem;max-width:760px;position:relative}
body.dark .card{--surface:#fff;--ink:#14213D;--muted:#5B6781;--rule:#D3DBE8;--tint:#E9EEF7;background:#fff;color:#14213D}
.card-head{display:flex;justify-content:space-between;gap:1rem;border-bottom:3px double var(--ink);padding-bottom:1rem;margin-bottom:1.25rem}
.card-brand{display:flex;gap:.9rem;align-items:center}
.card-logo{width:54px;height:54px;object-fit:contain}
.card-head h3{font-size:1.5rem;margin:0}
.card-head .sub{color:var(--muted);font-size:.95rem}
.who-line{display:flex;flex-wrap:wrap;gap:.25rem 2.5rem;margin-bottom:1.25rem}
.who-line div span{display:block;font-size:.8rem;color:var(--muted)}
.who-line div b{font-family:var(--serif);font-size:1.25rem;font-weight:600}
.card table th{background:none;border-bottom:2px solid var(--ink);color:var(--ink)}
.card td{font-family:var(--serif);font-size:1.05rem}
.card td.rem{font-family:var(--sans);font-size:.9rem;color:var(--muted)}
.sum{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:1.5rem;margin-top:1.5rem}
.sum dl{margin:0;display:grid;grid-template-columns:auto auto;gap:.2rem 1.5rem}
.sum dt{color:var(--muted);font-size:.9rem}
.sum dd{margin:0;font-weight:700;font-family:var(--serif);font-size:1.15rem}
.stamp{width:104px;height:104px;border:3px solid #D62839;color:#D62839;border-radius:50% 46% 52% 48% / 48% 53% 47% 52%;display:grid;place-content:center;text-align:center;transform:rotate(-7deg);font-family:var(--serif);line-height:1.1}
.stamp b{font-size:1.9rem}
.stamp span{font-family:var(--sans);font-size:.75rem;font-weight:600}
.comments{margin-top:1.5rem;border-top:1px solid var(--rule);padding-top:.8rem}
.comments p{font-family:var(--serif);margin:.4rem 0}
.sign{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem;margin-top:2.5rem}
.sign div{border-top:1px solid var(--ink);padding-top:.3rem;font-size:.8rem;color:var(--muted)}
.card-actions{margin-top:1rem}
.batch .card{margin-bottom:1.5rem}

/* toast */
.toast{position:fixed;left:50%;bottom:1.25rem;transform:translateX(-50%);background:#142038;color:#fff;padding:.7rem 1.1rem;border-radius:10px;font-weight:500;z-index:60;max-width:90vw}
.toast.bad{background:var(--pen);color:#fff}

/* landing and sign-in */
.landing{min-height:100vh;background:linear-gradient(160deg,#173a8c,#1f5d98);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2rem;padding:1.5rem;color:#fff}
.land-card{background:#fff;color:#142038;border-radius:16px;padding:2rem 1.75rem;text-align:center;max-width:420px;width:100%}
.land-card h1{font-size:1.8rem;margin:1.25rem 0 .4rem}
.land-sub{margin:0;color:#5E6B85}
.land-btns{display:grid;gap:.6rem;margin-top:1.5rem}
.logo{max-height:84px;max-width:100%}
.logo-name{font-family:var(--serif);font-weight:700;font-size:1.5rem}
.auth{min-height:100vh;background:var(--paper);display:flex;flex-direction:column;align-items:center;gap:1.5rem;padding:2.5rem 1rem}
.auth-card{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--rule);border-radius:14px;overflow:hidden}
.auth-head{padding:1.25rem 1.5rem;border-bottom:1px solid var(--rule)}
.auth-head h2{margin:0 0 .2rem;font-size:1.5rem}
.auth-head p{margin:0;color:var(--muted)}
.auth-body{padding:1.5rem;display:grid;gap:1rem}
.auth-actions{background:var(--tint);border-top:1px solid var(--rule);padding:1.25rem 1.5rem}
.auth-foot{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--rule)}
.auth-foot button{background:none;border:0;font:inherit;font-weight:600;color:var(--primary);padding:1rem;cursor:pointer}
body.dark .auth-foot button{color:#9DB8FF}
.auth-foot button + button{border-left:1px solid var(--rule)}
.auth-foot button:hover{background:var(--tint)}
.auth .copy{color:var(--muted);font-size:.9rem;margin:0;text-align:center}
.dob{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}
.dob-title{font-size:.9rem;font-weight:500;color:var(--muted);margin:0 0 -.4rem}
.preview{max-width:100%;max-height:200px;border:1px solid var(--rule);border-radius:8px}

/* registrations and student profile */
.reg-list{display:grid;gap:1rem}
.reg-card{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:1.25rem;display:grid;grid-template-columns:240px 1fr;gap:1.25rem}
.reg-card img{width:100%;border:1px solid var(--rule);border-radius:8px;display:block}
.reg-card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:.3rem 1rem}
.reg-card dt{color:var(--muted);font-size:.9rem}
.reg-card dd{margin:0}
.reg-card h3{margin-bottom:.8rem}
.actions{display:flex;gap:.6rem;margin-top:1rem;flex-wrap:wrap}
.pcard{background:var(--surface);border:1px solid var(--rule);border-radius:12px;overflow:hidden;margin-bottom:1rem}
.pphoto{display:block;width:100%;max-height:460px;object-fit:contain;background:#0f1522}
.pbody{padding:1.25rem 1.4rem}
.preg{font-family:var(--serif);font-size:1.6rem;font-weight:600;line-height:1.2}
.pname{color:var(--muted);margin:.3rem 0 1rem}
.pbtns{display:grid;gap:.6rem}
.phead{padding:1rem 1.4rem;border-bottom:1px solid var(--rule);font-weight:600}
.pbody h4{margin:1rem 0 .2rem}
.pbody h4:first-child{margin-top:0}
.pbody p{margin:.2rem 0}
.crumb{color:var(--muted);margin:0 0 .4rem}
h1.pg{font-size:1.8rem;margin-bottom:1rem}
.form-card{display:grid;gap:1rem}
.narrow{max-width:640px}

@media (max-width:640px){
  .card{padding:1.25rem}
  .sign{grid-template-columns:1fr}
  .reg-card{grid-template-columns:1fr}
  .grades-grid{grid-template-columns:70px 70px 1fr auto}
  main{padding:1.1rem .9rem 4rem}
}
@media print{
  body,body.dark{background:#fff;color:#000}
  .side,.topbar,.scrim,.filters,.card-actions,.toast,.page-head{display:none!important}
  .mainwrap{margin:0!important}
  main{padding:0;max-width:none}
  .card{border:0;padding:0;max-width:none}
  .batch .card{break-after:page;page-break-after:always;margin:0}
  .batch .card:last-child{break-after:auto;page-break-after:auto}
}
.notice{background:rgba(183,121,31,.15);border:1px solid var(--warn);border-radius:10px;padding:.7rem 1rem;margin-bottom:1rem}
@media print{.notice{display:none!important}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

main > h2{margin-bottom:1rem}
.land-card .btn.ghost{color:#1E429F;border-color:#1E429F}
.land-card .btn.ghost:hover{background:#EAF0FA}
@media print{main > h2{display:none!important}}
</style>
</head>

<script>
/* ============ SETTINGS: change these ============ */
const SUPABASE_URL = "https://axeshnishmdzugwfswjn.supabase.co";
const SUPABASE_KEY = "sb_publishable_w-Ha_xTAEFY0wDxy6aNHNw_wkRslc8G";
let SCHOOL_NAME  = "Your School Name";   // default only: set the real name in Settings
const SCHOOL_LOGO  = "";   // optional: paste a link to the school logo image
// Students sign in with their reg number. Behind the scenes each student gets a login address
// built from this mailbox, like yourname+f120260001@gmail.com. Use a mailbox the SCHOOL owns,
// and keep "Confirm email" switched off in Supabase so no emails are sent to it.
const LOGIN_LOCAL  = "muzamayitanaka";
const LOGIN_DOMAIN = "gmail.com";
// Grading scale: [minimum mark, grade, remark]. Change to match the school.
let GRADES = [   // default only: edit the scale in Settings
  [80,"A","Excellent"],
  [70,"B","Very good"],
  [60,"C","Good"],
  [50,"D","Satisfactory"],
  [40,"E","Needs improvement"],

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const app = document.getElementById("app");

/* Supabase returns at most 1000 rows per request, so read big lists in pages. */
async function fetchAll(build) {
  const out = [];
  for (let from = 0; ; from += 1000) {
    const { data, error } = await build().range(from, from + 999);
    if (error) throw error;
    out.push(...data);
    if (data.length < 1000) break;
  }
  return out;
}

  const { data: prof } = await sb.from("profiles").select("*").eq("id", session.user.id).maybeSingle();
  if (prof) { me = prof; await loadRef(); await loadAssigns(); return showApp(); }
  // Signed in but no role yet: a student who is still registering, or someone waiting for a role.
  const { data: reg } = await sb.rpc("my_registration");
  if (reg && reg.status !== "rejected") return showPending(reg);
  const meta = session.user.user_metadata || {};
  if (meta.reg_number) return showDetails({ reg: meta.reg_number, name: meta.entered_name || "", session, rej: reg || null });
  return showNoRole(session.user.email);
}

async function compressImage(file) {
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, 1000 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error("Could not read that photo.")), "image/jpeg", 0.8));
}

function readDob() {
  const y = +q("dY").value, m = +q("dM").value, d = +q("dD").value;
  if (!y || !m || !d) return null;
  const dt = new Date(y, m - 1, d);
  if (dt.getMonth() !== m - 1) return null;
  return `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
}

        if (pw !== q("dPass2").value) return err("The two passwords do not match.");
        const { data, error } = await sb.auth.signUp({
          email: authEmail(ctx.reg), password: pw, options: { data: { reg_number: ctx.reg, entered_name: ctx.name } }
        });
        if (error) return err(/registered/i.test(error.message)
          ? "You already started registering. Go back, sign in with your registration number and the password you chose, and finish there."
          : error.message);
        if (!data.session) return err("Your account was created but could not sign in. Ask the school office to switch off email confirmation.");
        ctx.session = data.session;
      }
      const blob = await compressImage(q("dPhoto").files[0]);
      const path = `${ctx.session.user.id}/id.jpg`;
      const up = await sb.storage.from("id-photos").upload(path, blob, { upsert: true, contentType: "image/jpeg" });
      if (up.error) return err(up.error.message);
      const { error } = await sb.rpc("claim_student", {
        p_reg: ctx.reg, p_name: ctx.name, p_dob: dob, p_address: q("dAddr").value.trim(), p_email: q("dEmail").value.trim(), p_phone: q("dPhone").value.trim(), p_photo_path: path
      });
      if (error) return err(error.message);
      boot();
    } catch (ex) { err(ex.message || "Something went wrong. Try again."); }
  };
}

function go(id) {
  const m = MODULES[id];
  if (!m || !main) return Promise.resolve();
  curModule = id;
  document.querySelectorAll(".nav-i[data-m]").forEach(b => b.classList.toggle("on", b.dataset.m === id));
  closeSide();
  main.onclick = null;
  window.scrollTo(0, 0);
  return Promise.resolve().then(() => m.render()).catch(err => {
    main.innerHTML = pageHead(m.title) + empty(esc((err && err.message) || "Something went wrong. Try again."));
  });
}

/* ---------- enter marks ---------- */
function viewMarks() {
  const classes = scopeClasses();
  if (!classes.length || !ref.subjects.length) {
    main.innerHTML = pageHead("Enter marks") + empty(me.role === "teacher"
      ? "You have not been assigned any classes and subjects yet. Ask the administrator."
      : "Add at least one class and one subject first under Classes and subjects.");
    return;
  }
  main.innerHTML = pageHead("Enter marks", "Examination and test marks out of 100.") + `
  <div class="filters">
    <label>Class<select id="mClass">${idOpts(classes, "name")}</select></label>
    <label>Subject<select id="mSubject"></select></label>
    <label>Term<select id="mTerm">${termOpts(SETTINGS.current_term)}</select></label>
    <label>Year<input id="mYear" type="number" value="${thisYear}" min="2000" max="2100"></label>
  </div>
  <div id="mTable"><p class="empty">Loading...</p></div>`;
  const fillSubjects = () => { q("mSubject").innerHTML = idOpts(scopeSubjects(+q("mClass").value), "name"); };
  fillSubjects();

  const load = async () => {
    const classId = +q("mClass").value, subjectId = +q("mSubject").value, term = +q("mTerm").value, year = +q("mYear").value;
    const box = q("mTable");
    if (!subjectId) { box.innerHTML = empty("No subject is assigned for this class."); return; }
    box.innerHTML = empty("Loading...");
    let studs, marks;
    try {
      studs = await fetchAll(() => sb.from("students").select("id,full_name,reg_number").eq("class_id", classId).order("full_name").order("id"));
      marks = studs.length ? await fetchAll(() => sb.from("marks").select("student_id,score,students!inner(class_id)")
        .eq("subject_id", subjectId).eq("term", term).eq("year", year).eq("students.class_id", classId).order("id")) : [];
    } catch (err) { return toast(err.message, true); }
    if (!studs.length) { box.innerHTML = empty("No students in this class yet."); return; }
    const byId = Object.fromEntries(marks.map(m => [m.student_id, m.score]));
    const rel = await sb.from("result_releases").select("release_at").eq("class_id", classId).eq("year", year).eq("term", term).maybeSingle();
    const relAt = rel.data ? new Date(rel.data.release_at) : null;
    const relLine = relAt ? (relAt <= new Date() ? `<p class="notice">Term ${term} results for this class were published on ${esc(niceDate(rel.data.release_at))}. Students and parents can see changes you save now.</p>` : `<p class="notice">Term ${term} results for this class will be released on ${esc(niceDate(rel.data.release_at))}.</p>`)
      : `<p class="hint" style="margin-bottom:1rem">These marks are private. Students and parents see them only after the administrator publishes the term's results.</p>`;
    box.innerHTML = relLine + `
    <div class="filters"><label>Find a student<input id="mSearch" placeholder="Name or reg number"></label><span class="hint">${studs.length} students</span></div>
    <div class="tablewrap"><table>
      <thead><tr><th>Student</th><th>Reg number</th><th class="num">Mark out of 100</th><th>Grade</th></tr></thead>
      <tbody>${studs.map(s => `
        <tr data-find="${esc((s.full_name + " " + (s.reg_number || "")).toLowerCase())}"><td>${esc(s.full_name)}</td><td>${esc(s.reg_number || "")}</td>
        <td class="num"><input class="mark" type="number" min="0" max="100" step="0.5" data-sid="${s.id}" value="${byId[s.id] ?? ""}" aria-label="Mark for ${esc(s.full_name)}"></td>
        <td class="g">${byId[s.id] != null ? gradeOf(byId[s.id]).letter : ""}</td></tr>`).join("")}
      </tbody></table></div>
    <button class="btn" id="saveMarks">Save marks</button>`;
    q("mSearch").oninput = e => {
      const t = e.target.value.trim().toLowerCase();
      box.querySelectorAll("tbody tr").forEach(tr => tr.hidden = t && !tr.dataset.find.includes(t));
    };
    box.oninput = e => {
      if (!e.target.classList.contains("mark")) return;
      const v = e.target.value;
      e.target.closest("tr").querySelector(".g").textContent = v === "" ? "" : gradeOf(+v).letter;
    };
    q("saveMarks").onclick = async () => {
      const rows = [];
      for (const inp of box.querySelectorAll("input.mark")) {
        if (inp.value === "") continue;
        const v = Number(inp.value);
        if (isNaN(v) || v < 0 || v > 100) return toast("Marks must be between 0 and 100.", true);
        rows.push({ student_id: +inp.dataset.sid, subject_id: subjectId, term, year, score: v });
      }
      if (!rows.length) return toast("Enter at least one mark.", true);
      for (let i = 0; i < rows.length; i += 500) {
        const { error } = await sb.from("marks").upsert(rows.slice(i, i + 500), { onConflict: "student_id,subject_id,term,year" });
        if (error) return toast(error.message, true);
      }
      toast(`Saved ${rows.length} marks.`);
    };
  };
  ["mSubject","mTerm","mYear"].forEach(id => q(id).onchange = load);
  q("mClass").onchange = () => { fillSubjects(); load(); };
  load();
}

/* ---------- comments ---------- */
const SUGGEST = {
  A: "Excellent results. Keep up the outstanding work.",
  B: "Very good performance. Aim a little higher next term.",
  C: "A good effort. More practice will lift your results.",
  D: "A fair result. Work harder and ask for help where needed.",
  E: "Below the expected level. More effort and extra study are needed.",
  U: "Serious improvement is needed. Please see the class teacher."
};

async function viewComments() {
  const classes = scopeClasses();
  if (!classes.length) {
    main.innerHTML = pageHead("Teacher comments") + empty(me.role === "teacher" ? "You have not been assigned any classes yet. Ask the administrator." : "Add a class first under Classes and subjects.");
    return;
  }
  const isAdmin = me.role === "admin";
  main.innerHTML = `
  ${pageHead("Teacher comments", "Short comments that print on each report card.")}
  <div class="filters">
    <label>Class<select id="kClass">${idOpts(classes, "name")}</select></label>
    <label>Term<select id="kTerm">${termOpts(SETTINGS.current_term)}</select></label>
    <label>Year<input id="kYear" type="number" value="${thisYear}" min="2000" max="2100"></label>
  </div>
  <div id="kBox"><p class="empty">Loading...</p></div>`;

  const load = async () => {
    const classId = +q("kClass").value, term = +q("kTerm").value, year = +q("kYear").value;
    const box = q("kBox");
    box.innerHTML = empty("Loading...");
    let studs, marks, cms;
    try {
      studs = await fetchAll(() => sb.from("students").select("id,full_name,reg_number").eq("class_id", classId).order("full_name").order("id"));
      marks = studs.length ? await fetchAll(() => sb.from("marks").select("student_id,score,students!inner(class_id)")
        .eq("term", term).eq("year", year).eq("students.class_id", classId).order("id")) : [];
      cms = studs.length ? await fetchAll(() => sb.from("report_comments").select("student_id,teacher_comment,head_comment,students!inner(class_id)")
        .eq("term", term).eq("year", year).eq("students.class_id", classId).order("student_id")) : [];
    } catch (err) { return toast(err.message, true); }
    if (!studs.length) { box.innerHTML = empty("No students in this class yet."); return; }
    const sums = {};
    marks.forEach(m => { const x = sums[m.student_id] || (sums[m.student_id] = { t: 0, n: 0 }); x.t += Number(m.score); x.n++; });
    const cm = Object.fromEntries(cms.map(c => [c.student_id, c]));
    box.innerHTML = `
    <div class="filters">
      <label>Find a student<input id="kSearch" placeholder="Name or reg number"></label>
      <button class="btn ghost" id="kSuggest">Suggest comments from marks</button>
      <span class="hint">Suggestions only fill empty boxes. You can edit them before saving.</span>
    </div>
    <div class="tablewrap"><table>
      <thead><tr><th>Student</th><th class="num">Average</th><th>Class teacher's comment</th>${isAdmin ? "<th>Head's comment</th>" : ""}</tr></thead>
      <tbody>${studs.map(st => {
        const x = sums[st.id], avg = x ? x.t / x.n : null, c = cm[st.id] || {};
        return `<tr data-sid="${st.id}" data-avg="${avg ?? ""}" data-find="${esc((st.full_name + " " + (st.reg_number || "")).toLowerCase())}">
          <td>${esc(st.full_name)}<br><span class="hint">${esc(st.reg_number || "")}</span></td>
          <td class="num">${avg == null ? "-" : avg.toFixed(1) + "%"}</td>
          <td><textarea data-k="t" data-orig="${esc(c.teacher_comment || "")}" aria-label="Teacher comment for ${esc(st.full_name)}">${esc(c.teacher_comment || "")}</textarea></td>
          ${isAdmin ? `<td><textarea data-k="h" data-orig="${esc(c.head_comment || "")}" aria-label="Head comment for ${esc(st.full_name)}">${esc(c.head_comment || "")}</textarea></td>` : ""}
        </tr>`; }).join("")}
      </tbody></table></div>
    <button class="btn" id="kSave">Save comments</button>`;

    q("kSearch").oninput = e => {
      const t = e.target.value.trim().toLowerCase();
      box.querySelectorAll("tbody tr").forEach(tr => tr.hidden = t && !tr.dataset.find.includes(t));
    };
    q("kSuggest").onclick = () => {
      let n = 0;
      box.querySelectorAll("tbody tr").forEach(tr => {
        const ta = tr.querySelector('textarea[data-k="t"]');
        if (tr.dataset.avg !== "" && !ta.value.trim()) { ta.value = SUGGEST[gradeOf(+tr.dataset.avg).letter] || ""; n++; }
      });
      toast(n ? `Filled ${n} comments. Edit them if you like, then save.` : "No empty boxes to fill.");
    };
    q("kSave").onclick = async () => {
      const rows = [];
      box.querySelectorAll("tbody tr").forEach(tr => {
        const t = tr.querySelector('textarea[data-k="t"]'), h = tr.querySelector('textarea[data-k="h"]');
        const changed = t.value.trim() !== t.dataset.orig.trim() || (h && h.value.trim() !== h.dataset.orig.trim());
        if (changed) rows.push({ student_id: +tr.dataset.sid, teacher: t.value, head: h ? h.value : null });
      });
      if (!rows.length) return toast("Nothing has changed.", true);
      for (let i = 0; i < rows.length; i += 300) {
        const { error } = await sb.rpc("save_comments", { p_term: term, p_year: year, p_rows: rows.slice(i, i + 300) });
        if (error) return toast(error.message, true);
      }
      toast(`Saved ${rows.length} comments.`);
      load();
    };
  };
  ["kClass","kTerm","kYear"].forEach(id => q(id).onchange = load);
  load();
}

async function viewReports() {
  const staff = me.role === "admin" || me.role === "teacher";
  const heading = staff ? "Report cards" : "Exam results";
  let mine = [];
  if (!staff) {
    const { data } = await sb.from("students").select("id,full_name").order("full_name");
    mine = data || [];
    if (!mine.length) {
      main.innerHTML = pageHead(heading) + empty("No student is linked to your login yet. Ask the school office to link your child's record.");
      return;
    }
  }
  main.innerHTML = pageHead(heading, staff ? "Open one student or a whole class." : "View and print report cards.") + `
  <div class="filters">
    ${staff
      ? `<label>Registration number<input id="rReg" placeholder="e.g. F1-2026-0001"></label>`
      : `<label>Student<select id="rStudent">${idOpts(mine, "full_name", activeKid)}</select></label>`}
    <label>Term<select id="rTerm">${termOpts(SETTINGS.current_term)}</select></label>
    <label>Year<input id="rYear" type="number" value="${thisYear}" min="2000" max="2100"></label>
    <button class="btn" id="rGo">Show report card</button>
  </div>
  ${staff ? `<div class="filters">
    <label>Or a whole class<select id="rClass">${idOpts(ref.classes, "name")}</select></label>
    <button class="btn ghost" id="rClassGo">Show whole class</button>
  </div>` : ""}
  <div id="rOut"></div>`;

  q("rGo").onclick = async () => {
    let sid;
    if (staff) {
      const reg = q("rReg").value.trim();
      if (!reg) return toast("Type the student's registration number.", true);
      const { data, error } = await sb.from("students").select("id").ilike("reg_number", reg.replace(/[%_\\]/g, m => "\\" + m)).limit(1);
      if (error) return toast(error.message, true);
      if (!data.length) return toast("No student has that registration number.", true);
      sid = data[0].id;
    } else sid = q("rStudent").value;
    const { data, error } = await sb.rpc("get_report", { p_student_id: +sid, p_term: +q("rTerm").value, p_year: +q("rYear").value });
    if (error) return toast(error.message, true);
    renderCard(data);
  };

  if (staff) q("rClassGo").onclick = async () => {
    if (!q("rClass").value) return toast("Add a class first.", true);
    q("rOut").innerHTML = empty("Building report cards...");
    const { data, error } = await sb.rpc("get_class_reports", { p_class_id: +q("rClass").value, p_term: +q("rTerm").value, p_year: +q("rYear").value });
    if (error) { q("rOut").innerHTML = ""; return toast(error.message, true); }
    if (!data.length) { q("rOut").innerHTML = empty("No marks have been recorded for this class in this term."); return; }
    q("rOut").innerHTML = (data[0].published === false ? `<div class="notice"><b>Not published yet.</b> Students and parents cannot see these results until you publish them under Publish results.</div>` : "") + `
      <div class="card-actions" style="margin:0 0 1rem"><button class="btn" onclick="window.print()">Print all ${data.length} report cards</button>
      <span class="hint">One card per page. In the print window you can choose Save as PDF. Students with no marks are left out.</span></div>
      <div class="batch">${data.map(cardHtml).join("")}</div>`;
  };
}

function cardHtml(d) {
  const marks = d.marks || [];
  const total = marks.reduce((a, m) => a + Number(m.score), 0);
  const avg = total / marks.length;
  const g = gradeOf(avg);
  const comments = (d.teacher_comment || d.head_comment) ? `
    <div class="comments">
      ${d.teacher_comment ? `<p><b>Class teacher:</b> ${esc(d.teacher_comment)}</p>` : ""}
      ${d.head_comment ? `<p><b>Head:</b> ${esc(d.head_comment)}</p>` : ""}
    </div>` : "";
  return `
  <article class="card">
    <div class="card-head">
      <div class="card-brand">${SETTINGS.logo_url ? `<img class="card-logo" src="${esc(SETTINGS.logo_url)}" alt="">` : ""}<div><h3>${esc(SCHOOL_NAME)}</h3><div class="sub">Student report${SETTINGS.motto ? " &middot; " + esc(SETTINGS.motto) : ""}</div></div></div>
      <div class="sub" style="text-align:right">Term ${d.term}<br>${d.year}</div>
    </div>
    <div class="who-line">
      <div><span>Student</span><b>${esc(d.student.name)}</b></div>
      <div><span>Reg number</span><b>${esc(d.student.reg || "-")}</b></div>
      <div><span>Class</span><b>${esc(d.student.class || "-")}</b></div>
    </div>
    <div class="tablewrap" style="border:0;border-radius:0;margin:0"><table>
      <thead><tr><th>Subject</th><th class="num">Mark</th><th>Grade</th><th>Remark</th></tr></thead>
      <tbody>${marks.map(m => { const x = gradeOf(Number(m.score)); return `
        <tr><td>${esc(m.subject)}</td><td class="num">${Number(m.score)}</td><td><b>${x.letter}</b></td><td class="rem">${x.remark}</td></tr>`; }).join("")}
      </tbody></table></div>
    <div class="sum">
      <dl>
        <dt>Total</dt><dd>${total}</dd>
        <dt>Average</dt><dd>${avg.toFixed(1)}%</dd>
        <dt>Overall grade</dt><dd>${g.letter}</dd>
      </dl>
      ${d.position ? `<div class="stamp" aria-label="Position ${d.position} of ${d.class_size}"><b>${ordinal(d.position)}</b><span>of ${d.class_size}</span></div>` : ""}
    </div>
    ${comments}
    <div class="sign"><div>Class teacher</div><div>Head</div><div>Parent / guardian</div></div>
  </article>`;
}

function renderCard(d) {
  const out = q("rOut");
  if (d.hidden === "unpublished") { out.innerHTML = empty(`Results for Term ${d.term}, ${d.year} have not been released yet. They will appear here when the school publishes them.`); return; }
  if (d.hidden === "parents_only") { out.innerHTML = empty("Your school shows results to parents and guardians only. Please ask your parent or guardian."); return; }
  if (!d.marks.length) { out.innerHTML = empty("No marks have been recorded for this student in this term."); return; }
  const notice = d.published === false ? `<div class="notice"><b>Not published yet.</b> Students and parents cannot see these results until you publish them.</div>` : "";
  out.innerHTML = notice + cardHtml(d) + `<div class="card-actions"><button class="btn" onclick="window.print()">Print or save as PDF</button></div>`;
}

function parseCSV(text, delim) {
  text = text.replace(/^\uFEFF/, "");
  const rows = []; let row = [], cur = "", inQ = false;
  const push = () => { row.push(cur); cur = ""; if (row.some(x => x.trim() !== "")) rows.push(row); row = []; };
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else inQ = false; } else cur += c; }
    else if (c === '"') inQ = true;
    else if (c === delim) { row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; push(); }
    else cur += c;
  }
  if (cur !== "" || row.length) push();
  return rows;
}

function fmtDate(y, mo, d) {
  const dt = new Date(y, mo - 1, d);
  if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) return null;
  return `${y}-${String(mo).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
}
function parseDob(v) {
  v = (v || "").trim(); let m;
  if ((m = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) return fmtDate(+m[1], +m[2], +m[3]);
  if ((m = v.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/))) return fmtDate(+m[3], +m[2], +m[1]);
  return null;
}

async function importStudents(file, statusEl) {
  const text = await file.text();
  const first = text.split(/\r?\n/)[0] || "";
  const delim = first.includes(";") && !first.includes(",") ? ";" : ",";
  const rows = parseCSV(text, delim);
  const head = (rows[0] || []).map(h => h.trim().toLowerCase());
  const iR = head.indexOf("reg_number"), iN = head.indexOf("full_name"), iC = head.indexOf("class"), iD = head.indexOf("dob");
  if (iR < 0 || iN < 0 || iC < 0) return toast("The first row must have the headings reg_number, full_name and class.", true);
  const map = new Map();
  rows.slice(1).forEach(r => {
    const reg = (r[iR] || "").trim(), name = (r[iN] || "").trim(), cls = (r[iC] || "").trim();
    if (reg && name && cls) map.set(reg, { reg, name, cls, dob: iD >= 0 ? parseDob(r[iD]) : null });
  });
  const data = [...map.values()];
  if (!data.length) return toast("No students found in that file.", true);
  statusEl.textContent = "Creating classes...";
  const c = await sb.from("classes").upsert([...new Set(data.map(r => r.cls))].map(name => ({ name })), { onConflict: "name" }).select();
  if (c.error) return toast(c.error.message, true);
  const classId = Object.fromEntries(c.data.map(x => [x.name, x.id]));
  for (let i = 0; i < data.length; i += 500) {
    statusEl.textContent = `Importing ${Math.min(i + 500, data.length)} of ${data.length}...`;
    const slice = data.slice(i, i + 500);
    const ins = await sb.from("students")
      .upsert(slice.map(r => ({ reg_number: r.reg, full_name: r.name, class_id: classId[r.cls] })), { onConflict: "reg_number" })
      .select("id,reg_number");
    if (ins.error) { statusEl.textContent = ""; return toast(ins.error.message, true); }
    const idOf = Object.fromEntries(ins.data.map(x => [x.reg_number, x.id]));
    const bd = slice.filter(r => r.dob && idOf[r.reg]).map(r => ({ student_id: idOf[r.reg], birth_date: r.dob }));
    if (bd.length) {
      const b = await sb.from("student_birthdates").upsert(bd, { onConflict: "student_id" });
      if (b.error) { statusEl.textContent = ""; return toast(b.error.message, true); }
    }
  }
  statusEl.textContent = "";
  toast(`Imported ${data.length} students.`);
}

async function addDemo() {
  try {
    const cls = await sb.from("classes").upsert({ name: "Form 3A" }, { onConflict: "name" }).select().single();
    if (cls.error) throw cls.error;
    const subjNames = ["English Language","Mathematics","Shona","Integrated Science","Geography","History","Computer Science"];
    const subs = await sb.from("subjects").upsert(subjNames.map(name => ({ name })), { onConflict: "name" }).select();
    if (subs.error) throw subs.error;
    const existing = await sb.from("students").select("id").eq("class_id", cls.data.id).limit(1);
    if (existing.data && existing.data.length) return toast("Form 3A already has students, so demo data was skipped.", true);
    const names = ["Tendai Moyo","Rudo Chikwanha","Tafara Ncube","Nyasha Dube","Farai Mutasa","Chipo Sibanda","Kudzai Banda","Thandiwe Nkomo"];
    const studs = await sb.from("students").insert(names.map((full_name, i) => ({ full_name, class_id: cls.data.id, reg_number: "DEMO-" + String(i + 1).padStart(4, "0") }))).select();
    if (studs.error) throw studs.error;
    const rows = [];
    studs.data.forEach(st => {
      const strength = 45 + Math.random() * 35;
      subs.data.forEach(sub => rows.push({
        student_id: st.id, subject_id: sub.id, term: 1, year: thisYear,
        score: Math.max(20, Math.min(98, Math.round(strength + (Math.random() * 30 - 15))))
      }));
    });
    const m = await sb.from("marks").insert(rows);
    if (m.error) throw m.error;
    await addDemoExtras(cls.data.id, subs.data, studs.data);
    toast("Demo data added. Open Report cards and type DEMO-0001.");
  } catch (err) { toast(err.message || "Could not add demo data.", true); }
}

async function addDemoExtras(classId, subs, studs) {
  try {
    const rows = []; let added = 0;
    const now = new Date();
    for (let back = 0; added < 8 && back < 20; back++) {
      const day = new Date(now.getFullYear(), now.getMonth(), now.getDate() - back);
      if (day.getDay() === 0 || day.getDay() === 6) continue;
      added++;
      const ds = `${day.getFullYear()}-${String(day.getMonth() + 1).padStart(2, "0")}-${String(day.getDate()).padStart(2, "0")}`;
      studs.forEach(st => { const r = Math.random(); rows.push({ student_id: st.id, att_date: ds, status: r < 0.86 ? "present" : r < 0.94 ? "late" : "absent" }); });
    }
    await sb.from("attendance").upsert(rows, { onConflict: "student_id,att_date" });
    const times = [["07:30", "08:10"], ["08:10", "08:50"], ["09:10", "09:50"], ["09:50", "10:30"]], slots = [];
    for (let day = 1; day <= 5; day++) times.forEach((t, i) => slots.push({ class_id: classId, day, start_time: t[0], end_time: t[1], subject_id: subs[(day + i * 2) % subs.length].id, room: "Room " + (i + 1) }));
    await sb.from("timetable_slots").insert(slots);
    await sb.from("fee_charges").insert([1, 2, 3].map(term => ({ class_id: classId, year: thisYear, term, description: "School fees", amount: 150 })));
    await sb.from("fee_payments").insert(studs.slice(0, 6).map((st, i) => ({ student_id: st.id, year: thisYear, term: 1, amount: i % 3 === 0 ? 150 : 75, method: "Cash" })));
    await sb.from("result_releases").upsert({ class_id: classId, year: thisYear, term: 1, release_at: new Date().toISOString() }, { onConflict: "class_id,year,term" });
    await sb.from("announcements").insert({ title: "Welcome to the new term", body: "Classes start at 7:30. Please check the timetable and make sure fees are up to date.", audience: "all", pinned: true });
  } catch (e) { /* the new tables may not exist yet; the core demo still works */ }
}

    latestReport(k.id), attSummary(k.id), feeStatement(k.id), annList(3), slotsFor({ class_id: k.class_id }, todayDow())]);

    stat("New announcements", String(unread), unread ? "Open Announcements to read" : "You are up to date", "megaphone")

      `${esc(k.full_name)} &middot; ${esc(clsName(k.class_id))} &middot; ${esc(k.reg_number || "")}`) +

async function viewResults() {

/* class performance analytics for teachers and the admin */
async function viewAnalytics() {
  const classes = scopeClasses();
  if (!classes.length) { main.innerHTML = pageHead("Class analytics") + empty(me.role === "teacher" ? "You have not been assigned any classes yet." : "Add a class first."); return; }
  main.innerHTML = pageHead("Class analytics", "How a class is doing in a term.") + `
    <div class="filters">
      <label>Class<select id="nClass">${idOpts(classes, "name")}</select></label>
      <label>Subject<select id="nSub"></select></label>
      <label>Term<select id="nTerm">${termOpts(SETTINGS.current_term)}</select></label>
      <label>Year<input id="nYear" type="number" value="${thisYear}" min="2000" max="2100"></label>
    </div>
    <div id="nBox">${empty("Loading...")}</div>`;
  const fillSubs = () => {
    const subs = scopeSubjects(+q("nClass").value);
    q("nSub").innerHTML = `<option value="0">All subjects</option>` + idOpts(subs, "name");
  };
  const load = async () => {
    const classId = +q("nClass").value, subId = +q("nSub").value, term = +q("nTerm").value, year = +q("nYear").value, box = q("nBox");
    box.innerHTML = empty("Loading...");
    let marks, studs;
    try {
      marks = await fetchAll(() => {
        let qy = sb.from("marks").select("student_id,subject_id,score,students!inner(class_id)").eq("term", term).eq("year", year).eq("students.class_id", classId).order("id");
        if (subId) qy = qy.eq("subject_id", subId);
        return qy;
      });
      studs = await fetchAll(() => sb.from("students").select("id,full_name").eq("class_id", classId).order("id"));
    } catch (err) { return toast(err.message, true); }
    if (me.role === "teacher" && !subId) {
      const allowed = new Set(scopeSubjects(classId).map(s => s.id));
      marks = marks.filter(m => allowed.has(m.subject_id));
    }
    if (!marks.length) { box.innerHTML = empty("No marks have been entered for this selection yet."); return; }
    const scores = marks.map(m => Number(m.score));
    const mean = scores.reduce((a, b) => a + b, 0) / scores.length;
    const pass = Math.round(scores.filter(x => x >= 50).length / scores.length * 100);
    const dist = {}; GRADES.forEach(g => { dist[g[1]] = 0; }); scores.forEach(x => { dist[gradeOf(x).letter]++; });
    const maxN = Math.max(1, ...Object.values(dist));
    const per = {};
    marks.forEach(m => { const p = per[m.student_id] || (per[m.student_id] = { t: 0, n: 0 }); p.t += Number(m.score); p.n++; });
    const nameOf = Object.fromEntries(studs.map(s => [s.id, s.full_name]));
    const ranked = Object.entries(per).map(([id, p]) => ({ name: nameOf[id] || "-", avg: p.t / p.n })).sort((a, b) => b.avg - a.avg);
    let subjectPanel = "";
    if (!subId) {
      const bySub = {};
      marks.forEach(m => { const p = bySub[m.subject_id] || (bySub[m.subject_id] = { t: 0, n: 0 }); p.t += Number(m.score); p.n++; });
      subjectPanel = panel("Average by subject", hbars(Object.entries(bySub).map(([id, p]) => ({ label: (ref.subjects.find(s => s.id === +id) || {}).name || "-", pct: p.t / p.n, text: (p.t / p.n).toFixed(1) + "%", tone: toneClass(p.t / p.n) })).sort((a, b) => b.pct - a.pct)));
    }
    const rankList = list => `<ul class="plain">${list.map(r => `<li>${esc(r.name)} <b style="float:right">${r.avg.toFixed(1)}%</b></li>`).join("")}</ul>`;
    box.innerHTML = `
      <div class="cards">
        ${stat("Class average", mean.toFixed(1) + "%", `${Object.keys(per).length} students with marks`, "chart", toneClass(mean))}
        ${stat("Highest mark", Math.max(...scores).toString(), "", "check", "good")}
        ${stat("Lowest mark", Math.min(...scores).toString(), "", "clock", "bad")}
        ${stat("Pass rate (50%+)", pass + "%", "", "results", toneClass(pass))}
      </div>
      <div class="grid2">
        ${panel("Grade distribution", hbars(Object.entries(dist).map(([g, n]) => ({ label: "Grade " + g, pct: n / maxN * 100, text: String(n) }))))}
        ${subjectPanel}
        ${panel("Top five", rankList(ranked.slice(0, 5)))}
        ${panel("Needs support (lowest five)", rankList(ranked.slice(-5).reverse()))}
      </div>`;
  };
  fillSubs();
  q("nClass").onchange = () => { fillSubs(); load(); };
  ["nSub", "nTerm", "nYear"].forEach(id => q(id).onchange = load);
  load();
}

async function viewStudentsAdmin() {
  main.innerHTML = pageHead("Students", "Import the school list, add students and manage accounts.") + `

      <p id="stCount"></p>
      <p>Save the Excel list as CSV with the headings <b>reg_number</b>, <b>full_name</b> and <b>class</b>. If you also have dates of birth, add a <b>dob</b> column (like 15/03/2010) and students must enter the same date to register. Students can only create an account if their reg number and name are in this list. Missing classes are created for you.</p>
      <div class="row"><label>Student list (CSV file)<input id="impFile" type="file" accept=".csv,text/csv"></label><button class="btn" id="impGo">${icon("upload")} Import students</button></div>
      <p id="impStatus" class="hint" style="margin-top:.6rem"></p>`)}
    ${panel("Add one student", `
      <form class="row" id="fStudent">
        <label>Reg number<input id="nReg" required></label>
        <label>Full name<input id="nStudent" required></label>
        <label>Class<select id="nStudentClass" required>${idOpts(ref.classes, "name")}</select></label>
        <button class="btn" type="submit">Add student</button>
      </form>`)}
    ${panel("Find a student", `
      <label style="max-width:22rem">Name or reg number<input id="stSearch"></label>
      <div id="stList" style="margin-top:1rem"></div>`)}`;
  sb.from("students").select("id", { count: "exact", head: true }).then(r => { if (q("stCount")) q("stCount").textContent = `${r.count ?? 0} students in the system.`; });
  const search = async () => {
    const t = likeSafe(q("stSearch").value), box = q("stList");
    if (t.length < 2) { box.innerHTML = `<p class="hint">Type at least 2 letters or numbers.</p>`; return; }
    const { data, error } = await sb.from("students").select("id,full_name,reg_number,class_id,user_id")
      .or(`full_name.ilike.%${t}%,reg_number.ilike.%${t}%`).order("full_name").limit(25);
    if (error) return toast(error.message, true);
    box.innerHTML = data.length ? `<div class="tablewrap"><table>
      <thead><tr><th>Name</th><th>Reg number</th><th>Class</th><th>Account</th><th></th></tr></thead>
      <tbody>${data.map(s => `<tr><td>${esc(s.full_name)}</td><td>${esc(s.reg_number || "")}</td><td>${esc(clsName(s.class_id))}</td>
        <td>${s.user_id ? '<span class="tag good">Registered</span>' : '<span class="tag">Not yet</span>'}</td>
        <td class="num">${s.user_id ? `<button class="btn ghost sm" data-reset="${s.id}">Reset account</button> ` : ""}<button class="btn danger" data-del="${s.id}">Delete</button></td></tr>`).join("")}
      </tbody></table></div>` : `<p class="hint">No match.</p>`;
  };
  let tmr; q("stSearch").oninput = () => { clearTimeout(tmr); tmr = setTimeout(search, 300); };
  search();
  q("impGo").onclick = async () => {
    const f = q("impFile").files[0];
    if (!f) return toast("Choose the CSV file first.", true);
    q("impGo").disabled = true;
    await loadRef();
    await importStudents(f, q("impStatus"));
    await loadRef();
    viewStudentsAdmin();
  };
  q("fStudent").onsubmit = async e => {
    e.preventDefault();
    if (!q("nStudentClass").value) return toast("Add a class first.", true);
    const { error } = await sb.from("students").insert({ reg_number: q("nReg").value.trim(), full_name: q("nStudent").value.trim(), class_id: +q("nStudentClass").value });
    if (error) return toast(error.message, true);
    toast("Student added."); viewStudentsAdmin();
  };
  main.onclick = async e => {
    const r = e.target.closest("[data-reset]");
    if (r) { if (await resetAccount(+r.dataset.reset)) search(); return; }
    const b = e.target.closest("[data-del]");
    if (!b || !confirm("Delete this student and all their marks?")) return;
    const { error } = await sb.from("students").delete().eq("id", +b.dataset.del);
    if (error) return toast(error.message, true);
    toast("Student deleted."); search();
  };
}

    toast("Deleted."); viewFeesAdmin();
  };
}

      ${panel("School identity", `
        <div class="stack narrow">
          <label>School name<input id="sName" required value="${esc(SETTINGS.school_name)}"></label>
          <label>Motto (optional)<input id="sMotto" value="${esc(SETTINGS.motto || "")}"></label>
          <div class="row">${SETTINGS.logo_url ? `<img src="${esc(SETTINGS.logo_url)}" alt="Current logo" style="width:64px;height:64px;object-fit:contain;border:1px solid var(--rule);border-radius:8px;background:#fff">` : ""}
            <label>School logo (PNG or JPG)<input id="sLogo" type="file" accept="image/png,image/jpeg,image/webp"></label></div>
        </div>`)}
      ${panel("Academic year", `
        <div class="row">
          <label>Current year<input id="sYear" type="number" min="2000" max="2100" required value="${SETTINGS.current_year}" style="width:7rem"></label>
          <label>Current term<select id="sTerm">${termOpts(SETTINGS.current_term)}</select></label>
          <label>Currency symbol<input id="sCur" required maxlength="6" value="${esc(SETTINGS.currency || "US$")}" style="width:6rem"></label>
        </div>
        ${"students_see_results" in SETTINGS ? `<label class="check" style="margin-top:1rem"><input type="checkbox" id="sStuSee" ${SETTINGS.students_see_results !== false ? "checked" : ""}> Students can see their own published results</label>
        <p class="hint">Untick this if only parents and guardians should see results. Students will then see a message to ask their parent.</p>` : ""}
        <p class="hint" style="margin-top:.8rem">Marks, attendance and fees are saved per year and term. Changing the current term only changes what the portal opens on.</p>`)}
      ${panel("Grading scale", `
        <p>Each row gives the lowest mark for a grade. Keep a row that starts at 0.</p>
        <div id="gRows"></div>
        <button class="btn ghost sm" type="button" id="gAdd">${icon("plus")} Add a grade</button>`)}
      <button class="btn" type="submit" id="setSave">Save settings</button>
    </form>
    ${panel("Demo data", `<p>Adds one class, seven subjects, eight students, marks, attendance, a timetable, fees and an announcement so you can see the portal working. Demo students use reg numbers starting with DEMO-.</p><button class="btn ghost" id="demo">Add demo data</button>`)}`;
  const drawGrades = () => {
    q("gRows").innerHTML = g.map((r, i) => `<div class="grades-grid">
      <input type="number" min="0" max="100" value="${r.min}" data-gi="${i}" data-gk="min" aria-label="Minimum mark">
      <input value="${esc(r.grade)}" maxlength="3" data-gi="${i}" data-gk="grade" aria-label="Grade">
      <input value="${esc(r.remark)}" data-gi="${i}" data-gk="remark" aria-label="Remark">
      <button type="button" class="btn danger" data-gdel="${i}">Remove</button></div>`).join("");
  };
  drawGrades();
  q("gRows").oninput = e => { const i = e.target.dataset.gi; if (i != null) g[i][e.target.dataset.gk] = e.target.dataset.gk === "min" ? Number(e.target.value) : e.target.value; };
  q("gRows").onclick = e => { const b = e.target.closest("[data-gdel]"); if (b) { g.splice(+b.dataset.gdel, 1); drawGrades(); } };
  q("gAdd").onclick = () => { g.push({ min: 0, grade: "", remark: "" }); drawGrades(); };
  q("demo").onclick = async () => { q("demo").disabled = true; await addDemo(); q("demo").disabled = false; };
  q("setForm").onsubmit = async e => {
    e.preventDefault();
    const clean = g.filter(r => r.grade.trim()).map(r => ({ min: Number(r.min), grade: r.grade.trim(), remark: (r.remark || "").trim() }));
    if (!clean.length || !clean.some(r => r.min === 0)) return toast("The grading scale needs a grade that starts at 0.", true);
    q("setSave").disabled = true;
    try {
      let logo = SETTINGS.logo_url || null;
      const f = q("sLogo").files[0];
      if (f) {
        const ext = (f.type.split("/")[1] || "png").replace("jpeg", "jpg");
        const up = await sb.storage.from("branding").upload("logo." + ext, f, { upsert: true, contentType: f.type });
        if (up.error) throw up.error;
        logo = sb.storage.from("branding").getPublicUrl("logo." + ext).data.publicUrl + "?v=" + Date.now();
      }
      const row = { school_name: q("sName").value.trim(), motto: q("sMotto").value.trim() || null, logo_url: logo,
        current_year: +q("sYear").value, current_term: +q("sTerm").value, currency: q("sCur").value.trim(), grades: clean, updated_at: new Date().toISOString() };
      if (q("sStuSee")) row.students_see_results = q("sStuSee").checked;
      const { error } = await sb.from("school_settings").update(row).eq("id", 1);
      if (error) throw error;
      applySettings(row);
      toast("Settings saved.");
      await showApp(); go("settings");
    } catch (err) { toast(err.message || "Could not save settings.", true); }
    q("setSave") && (q("setSave").disabled = false);
  };
}


/* ---------- publish results (admin) ---------- */
async function viewPublish() {
  await loadRef();
  if (!ref.classes.length) { main.innerHTML = pageHead("Publish results") + empty("Add a class first under Classes and subjects."); return; }
  main.innerHTML = pageHead("Publish results", "Students and parents see a term's results only after you publish them. Teachers can keep entering marks until then.") + `
    <div class="filters">
      <label>Year<input id="pbYear" type="number" value="${thisYear}" min="2000" max="2100"></label>
      <label>Term<select id="pbTerm">${termOpts(SETTINGS.current_term)}</select></label>
    </div>
    ${panel("Release settings", `
      <div class="row">
        <label>Release on (leave empty to publish now)<input id="pbWhen" type="datetime-local"></label>
        <label class="check"><input type="checkbox" id="pbAnn" checked> Post an announcement</label>
      </div>
      <p class="hint" style="margin-top:.7rem">Choose a future date and time to release results when the holidays start. Parents and students can then see them from that moment.</p>`)}
    <div id="pbBox">${empty("Loading...")}</div>`;
  const load = async () => {
    const year = +q("pbYear").value, term = +q("pbTerm").value;
    q("pbBox").innerHTML = empty("Loading...");
    const [rel, counts] = await Promise.all([
      sb.from("result_releases").select("class_id,release_at").eq("year", year).eq("term", term),
      Promise.all(ref.classes.map(async c => {
        const r = await sb.from("marks").select("id,students!inner(class_id)", { count: "exact", head: true }).eq("year", year).eq("term", term).eq("students.class_id", c.id);
        return r.count || 0;
      }))
    ]);
    const relBy = Object.fromEntries((rel.data || []).map(r => [r.class_id, r.release_at]));
    const now = new Date();
    q("pbBox").innerHTML = `
      <div class="quick" style="margin-bottom:1rem">
        <button class="btn" id="pbAll">Publish all classes</button>
        <button class="btn ghost" id="pbNone">Unpublish all classes</button>
      </div>
      <div class="tablewrap"><table><thead><tr><th>Class</th><th class="num">Marks entered</th><th>Status</th><th></th></tr></thead><tbody>
      ${ref.classes.map((c, i) => {
        const at = relBy[c.id] ? new Date(relBy[c.id]) : null;
        const status = !at ? '<span class="tag">Not published</span>' : at <= now ? `<span class="tag good">Published ${esc(niceDate(relBy[c.id]))}</span>` : `<span class="tag warn">Scheduled ${esc(at.toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }))}</span>`;
        return `<tr><td>${esc(c.name)}</td><td class="num">${counts[i]}</td><td>${status}</td>
          <td class="num"><button class="btn sm" data-pub="${c.id}">Publish</button> ${at ? `<button class="btn danger" data-unpub="${c.id}">Unpublish</button>` : ""}</td></tr>`;
      }).join("")}
      </tbody></table></div>`;
  };
  const publish = async ids => {
    const year = +q("pbYear").value, term = +q("pbTerm").value;
    const whenVal = q("pbWhen").value;
    const when = whenVal ? new Date(whenVal) : new Date();
    if (isNaN(when)) return toast("Check the release date.", true);
    const { error } = await sb.from("result_releases").upsert(ids.map(id => ({ class_id: id, year, term, release_at: when.toISOString() })), { onConflict: "class_id,year,term" });
    if (error) return toast(error.message, true);
    if (q("pbAnn").checked) {
      const future = when > new Date();
      await sb.from("announcements").insert({
        title: future ? `Term ${term} ${year} results will be released on ${when.toLocaleDateString("en-GB", { day: "numeric", month: "long" })}` : `Term ${term} ${year} results are now available`,
        body: future ? "You will be able to see the results under Results and Report cards from that day." : "You can now see the results under Results and Report cards.",
        audience: "all" });
    }
    toast(when > new Date() ? "Release scheduled." : `Published for ${ids.length} ${ids.length === 1 ? "class" : "classes"}.`);
    load();
  };
  q("pbYear").onchange = load; q("pbTerm").onchange = load;
  main.onclick = async e => {
    const y = +q("pbYear").value, t = +q("pbTerm").value;
    if (e.target.closest("#pbAll")) return publish(ref.classes.map(c => c.id));
    if (e.target.closest("#pbNone")) {
      if (!confirm("Hide this term's results from students and parents in every class?")) return;
      const { error } = await sb.from("result_releases").delete().eq("year", y).eq("term", t);
      if (error) return toast(error.message, true);
      toast("Results hidden again."); return load();
    }
    const pub = e.target.closest("[data-pub]"), un = e.target.closest("[data-unpub]");
    if (pub) return publish([+pub.dataset.pub]);
    if (un) {
      const { error } = await sb.from("result_releases").delete().eq("class_id", +un.dataset.unpub).eq("year", y).eq("term", t);
      if (error) return toast(error.message, true);
      toast("Results hidden again."); load();
    }
  };
  load();
}
